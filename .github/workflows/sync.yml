name: Sync content sources

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync sources
        run: npm run sync -- --refresh

      - name: Check content
        run: npm run check:content

      - name: Check tags
        run: npm run check:tags

      - name: Check links
        run: npm run check:links

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ github.event.repository.name }}

      - name: Commit and push synced content
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs reports
          if git diff --cached --quiet; then
            echo "No content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 仅 generatedAt 时间戳滚动不算内容更新，不提交
          if ! git diff --cached -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"generatedAt"' | grep -q .; then
            echo "Only generatedAt timestamps changed; skipping commit."
            git restore --source=HEAD --staged --worktree -- docs reports
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(sync): 定时同步内容参考"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches"
